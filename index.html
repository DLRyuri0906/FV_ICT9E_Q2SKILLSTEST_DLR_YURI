

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image:
                linear-gradient(
                    rgba(16, 11, 24, 0.65),
                    rgba(16, 11, 24, 0.80)
                ),
                url("school.png");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        .navbar {
            background-color: #21132e;
            padding: 10px 30px;
            border-bottom: 2px solid #9333ea;
        }

        .navbar-brand {
            color: #c084fc;
            font-size: 22px;
            font-weight: bold;
        }

        .navbar-brand:hover {
            color: white;
        }

        .nav-link {
            color: white;
            font-size: 13px;
        }

        .nav-link:hover {
            color: #c084fc;
        }

        .main-container {
            padding: 30px 15px;
        }

        .page-heading {
            text-align: center;
            color: white;
            margin-bottom: 20px;
        }

        .page-heading h1 {
            font-size: 32px;
            font-weight: bold;
        }

        .page-heading span {
            color: #c084fc;
        }

        .page-heading p {
            font-size: 12px;
            color: #e1d5ed;
        }

        .form-container {
            max-width: 750px;
            margin: auto;
            padding: 25px;
            background-color: rgba(255, 255, 255, 0.90);
            border-radius: 8px;
        }

        .form-container h5 {
            color: #7025a5;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .form-label {
            font-size: 11px;
            margin-bottom: 4px;
            color: #292033;
        }

        .form-control,
        .form-select {
            font-size: 12px;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #d4c0e5;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #9333ea;
            box-shadow: 0 0 4px #c084fc;
        }

        hr {
            border-color: #c8a8df;
            margin: 15px 0;
        }

        .form-check {
            font-size: 12px;
            margin-bottom: 5px;
        }

        .form-check-input:checked {
            background-color: #9333ea;
            border-color: #9333ea;
        }

        .submit-area {
            text-align: center;
            margin-top: 20px;
        }

        .submit-btn {
            background-color: #9333ea;
            color: white;
            border: none;
            padding: 10px 28px;
            font-size: 13px;
            border-radius: 5px;
        }

        .submit-btn:hover {
            background-color: #7e22ce;
        }

        footer {
            max-width: 750px;
            margin: 15px auto 0;
            padding: 12px;
            background-color: #21132e;
            color: #d8b4fe;
            text-align: center;
            font-size: 11px;
            border-top: 2px solid #9333ea;
        }

        @media (max-width: 576px) {

            .navbar {
                padding: 10px 15px;
            }

            .page-heading h1 {
                font-size: 25px;
            }

            .form-container {
                padding: 18px;
            }

        }

    </style>
</head>

<body>

    <nav class="navbar navbar-expand navbar-dark">

        <div class="container-fluid">

            <a class="navbar-brand text-decoration-none" href="index.html">
                OBMC.
            </a>

            <ul class="navbar-nav ms-auto flex-row">

                <li class="nav-item">
                    <a class="nav-link mx-2" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link mx-2" href="about.html">
                        About
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link mx-2" href="enroll.html">
                        Enroll
                    </a>
                </li>

            </ul>

        </div>

    </nav>

    <div class="main-container">

        <div class="page-heading">

            <h1>
                OBMC <span>Student Enrollment Form</span>
            </h1>

            <p>
                Fill out the form below to enroll for the upcoming school year.
            </p>

        </div>

        <div class="form-container">

            <form onsubmit="submitEnrollment(event)">

                <h5>Student Information</h5>

                <div class="row">

                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="text" class="form-control"
                               placeholder="First Name" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" class="form-control"
                               placeholder="Last Name" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Birth Date</label>
                        <input type="date" class="form-control" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Gender</label>
                        <select class="form-select" required>
                            <option value="">Select...</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Prefer not to say</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Grade Level</label>
                        <select class="form-select" required>
                            <option value="">Select...</option>
                            <option>Grade 7</option>
                            <option>Grade 8</option>
                            <option>Grade 9</option>
                            <option>Grade 10</option>
                            <option>Grade 11</option>
                            <option>Grade 12</option>
                        </select>
                    </div>

                </div>

                <hr>

                <h5>Contact Details</h5>

                <label class="form-label">Email Address</label>
                <input type="email" class="form-control"
                       placeholder="student@example.com" required>

                <label class="form-label">Contact Number</label>
                <input type="tel" class="form-control"
                       placeholder="09XX-XXX-XXXX" required>

                <label class="form-label">Home Address</label>
                <input type="text" class="form-control"
                       placeholder="Enter your complete address" required>

                <hr>

                <h5>Other Information</h5>

                <label class="form-label">Mode of Learning</label>

                <div class="form-check">
                    <input class="form-check-input" type="radio"
                           name="learning" required>
                    <label class="form-check-label">Online</label>
                </div>

                <div class="form-check">
                    <input class="form-check-input" type="radio"
                           name="learning">
                    <label class="form-check-label">Face-to-Face</label>
                </div>

                <div class="form-check mt-3">
                    <input class="form-check-input"
                           type="checkbox" required>
                    <label class="form-check-label">
                        I confirm that the information provided is true and complete.
                    </label>
                </div>

                <div class="submit-area">

                    <button type="submit" class="submit-btn">
                        Submit Enrollment
                    </button>

                </div>

            </form>

        </div>

        <footer>
            © 2026 OBMC | Student Enrollment Form
        </footer>

    </div>

    <script>

        function submitEnrollment(event) {

            event.preventDefault();

            alert("Thank you for choosing OBMC! Enrollment submitted successfully.");

            event.target.reset();

        }

    </script>

</body>
</html>
