
<!DOCTYPE html>
<html>
<head>
    <title>OBMC Enrollment Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('index.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial;
        }

        .navbar {
            background-color: #222;
        }

        h2 {
            color: white;
            text-align: center;
            margin-top: 20px;
        }

        p {
            color: white;
            text-align: center;
            font-size: 12px;
        }

        .form-box {
            background-color: rgba(255,255,255,0.85);
            padding: 20px;
            border-radius: 5px;
        }

        label {
            font-size: 13px;
        }

        .container {
            margin-top: 20px;
        }

        .btn {
            width: 100%;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container-fluid">

            <a class="navbar-brand" href="#">
                OBMC | Enroll Now
            </a>

            <form class="d-flex">
                <input class="form-control me-2" type="search" placeholder="Search">

                <button class="btn btn-primary" type="button"
                onclick="window.location.href='https://www.obmontessori.edu.ph'">
                    Search
                </button>
            </form>

        </div>
    </nav>

    <h2>OBMC Student Enrollment Form</h2>

    <p>Fill out the form below to enroll for the upcoming school year.</p>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7">

                <div class="form-box">

                    <h6>Student Information</h6>

                    <form>

                        <div class="row">

                            <div class="col-md-6 mb-2">
                                <label>First Name</label>
                                <input type="text" class="form-control" placeholder="Enter first name">
                            </div>

                            <div class="col-md-6 mb-2">
                                <label>Last Name</label>
                                <input type="text" class="form-control" placeholder="Enter last name">
                            </div>

                            <div class="col-md-4 mb-2">
                                <label>Birth Date</label>
                                <input type="date" class="form-control">
                            </div>

                            <div class="col-md-4 mb-2">
                                <label>Gender</label>
                                <select class="form-select">
                                    <option>Select...</option>
                                    <option>Male</option>
                                    <option>Female</option>
                                </select>
                            </div>

                            <div class="col-md-4 mb-2">
                                <label>Grade Level</label>
                                <select class="form-select">
                                    <option>Select...</option>
                                    <option>Grade 7</option>
                                    <option>Grade 8</option>
                                    <option>Grade 9</option>
                                    <option>Grade 10</option>
                                    <option>Grade 11</option>
                                    <option>Grade 12</option>
                                </select>
                            </div>

                        </div>

                        <hr>

                        <h6>Contact Details</h6>

                        <div class="mb-2">
                            <label>Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email">
                        </div>

                        <div class="mb-2">
                            <label>Contact Number</label>
                            <input type="tel" class="form-control" placeholder="09XX-XXX-XXXX">
                        </div>

                        <hr>

                        <h6>Other Information</h6>

                        <label>Mode of Learning</label>

                        <div>
                            <input type="radio" name="learning"> Online
                        </div>

                        <div>
                            <input type="radio" name="learning"> Face-to-Face
                        </div>

                        <div class="mt-3">
                            <input type="checkbox">
                            I confirm that the information provided is true and complete.
                        </div>

                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-primary">
                                Submit Enrollment
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <footer class="text-center text-white mt-4">
        <p>© 2026 OBMC Student Enrollment Form</p>
    </footer>

</body>
</html>
